name: Build Quest Voice Pad APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generate Wrapper and Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/QuestVoicePad-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestVoicePad-v1.1.0-apk
          path: release-output/QuestVoicePad-v1.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: Quest Voice Pad v1.1.0 (Release)
          body: |
            ### 🎙️ Quest Voice Pad for Meta Quest 3S / Horizon OS
            
            Плавающая панель голосового ввода для очков Meta Quest на встроенном веб-движке (Web Speech API).
            
            **Особенности:**
            - 🎙️ Голосовой ввод на русском (`ru-RU`) и английском (`en-US`) через встроенный движок Chromium WebView.
            - ⚡ **Мгновенное автокопирование** надиктованного текста в системный буфер обмена (`Clipboard`).
            - 📋 Быстрая вставка в браузер, мессенджеры и любые другие окна Quest через команду «Вставить» (Paste).
            - 🕒 История последних надиктованных фраз.
            - 🕶️ Компактный интерфейс для комфортного размещения рядом с браузером в режиме многозадачности Horizon OS.
            
            **Установка:**
            1. Скачайте `QuestVoicePad-v1.1.0.apk` ниже.
            2. Установите через **SideQuest** или команду:
               `adb install -r QuestVoicePad-v1.1.0.apk`
            3. Запустите **Quest Voice Pad** из раздела «Неизвестные источники» (Unknown Sources).
          files: release-output/QuestVoicePad-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
