name: Build Quest AI Keyboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/QuestAIKeyboard-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestAIKeyboard-v1.0.0-apk
          path: release-output/QuestAIKeyboard-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Quest AI Keyboard v1.0.0 (Release)
          body: |
            ### 🧠 Quest AI Keyboard for Meta Quest 3S / Horizon OS
            
            Автоматическая сборка умной виртуальной клавиатуры (IME) с голосовым вводом для очков Meta Quest.
            
            **Особенности:**
            - 🇷🇺 Русская раскладка (ЙЦУКЕН)
            - 🇬🇧 Английская раскладка (QWERTY)
            - 🎙️ Голосовой ввод на русском и английском языках (Google Speech / Android Recognizer)
            - 🔣 Цифровая и символьная панель
            - 👓 Оптимизировано под лазерный указатель и контроллеры Meta Quest 3S (увеличенные клавиши, контрастный темный интерфейс Horizon OS)
            
            **Установка:**
            1. Скачайте `QuestAIKeyboard-v1.0.0.apk` ниже.
            2. Подключите Meta Quest 3S к ПК и установите файл через **SideQuest** или `adb install -r QuestAIKeyboard-v1.0.0.apk`.
            3. Запустите приложение из вкладки "Неизвестные источники" (Unknown Sources).
            4. Нажмите кнопки настройки, чтобы включить клавиатуру и разрешить микрофон.
          files: release-output/QuestAIKeyboard-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
